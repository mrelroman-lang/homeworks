---
- name: Install nginx
  hosts: lighthouse
  become: true
  handlers:
    - name: start-nginx
      command: nginx
    - name: reload-nginx
      command: nginx -s reload 
      tags:
        - nginx
        - restartservice

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true

    - name: NGINX | Install NGINX
      ansible.builtin.apt:
        name: nginx
        state: present
      notify: start-nginx
      tags:
        - nginx
        - distr

    - name: NGINX | Create nginx configuration
      ansible.builtin.template:
        src: templates/nginx.conf.j2
        dest: /etc/nginx/nginx.conf  #"{{ nginx_config_path }}"
        mode: '0644'
      notify: reload-nginx
      tags:
        - nginx
        - config

- name: Install Lighthouse
  hosts: lighthouse
  become: yes
  handlers:
    - name: reload-nginx
      become: true
      command: nginx -s reload 
  pre_tasks:
    - name: Lighthouse | install dependencies
      become: true
      ansible.builtin.apt:
        name: git
        state: present
  tasks:
    # 1. Явно создаём директорию с правами root
    - name: Ensure Lighthouse directory exists
      ansible.builtin.file:
        path: "{{ lighthouse_location_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      become: yes  
    # 2. Клонируем репозиторий
    - name: Lighthouse | Copy from git
      ansible.builtin.git:
        repo: "{{ lighthouse_vcs }}"
        version: "{{ lighthouse_git_version }}"
        dest: "{{ lighthouse_location_dir }}"
        force: no
        accept_hostkey: yes
        depth: 1
        single_branch: yes
    - name: Lighthouse | Create Lighthouse config
      become: true
      ansible.builtin.template:
        src: templates/lighthouse.conf.j2
        dest: /etc/nginx/conf.d/default.conf  #/etc/nginx/conf.d/lighthouse.conf
        mode: '0644'
      notify: reload-nginx

# ----------Install ClickHouse------------
- name: Install ClickHouse
  hosts: clickhouse
  become: true

  tasks:
    - name: Install required packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - apt-transport-https
        state: present
        update_cache: true

    - name: Download ClickHouse packages
      ansible.builtin.get_url: 
        url: "https://packages.clickhouse.com/deb/pool/main/c/{{ item }}/{{ item }}_{{ clickhouse_version }}_{{ clickhouse_arch }}.deb"
        dest: "/tmp/{{ item }}_{{ clickhouse_version }}_{{ clickhouse_arch }}.deb"
        mode: "0644"
      loop: "{{ clickhouse_packages }}"

    - name: Install ClickHouse packages
      ansible.builtin.apt:
        deb: >-
          /tmp/{{ item }}_{{ clickhouse_version }}_{{ clickhouse_arch }}.deb
        state: present
      loop: "{{ clickhouse_packages }}"

    # ===== ВАЖНО: ЯВНЫЙ ЗАПУСК СЕРВИСА =====
    - name: Ensure clickhouse-server is started
      ansible.builtin.service:
        name: clickhouse-server
        state: started
        enabled: true
      register: service_started

    - name: Show service status
      ansible.builtin.debug:
        msg: "Service started: {{ service_started }}"

    # ===== ТЕПЕРЬ ЖДЕМ ПОРТ =====
    - name: Wait for ClickHouse native port
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 9000
        state: started
        timeout: 60
        delay: 5

    - name: Check ClickHouse availability
      ansible.builtin.command:
        cmd: clickhouse-client --query "SELECT 1"
      register: clickhouse_query
      until: clickhouse_query.rc == 0
      retries: 12
      delay: 5
      changed_when: false

    - name: Create logs database
      ansible.builtin.command:
        cmd: clickhouse-client --query "CREATE DATABASE IF NOT EXISTS logs"
      changed_when: false
      tags:
        - clickhouse
        - db

# ===== Install Vector =====
- name: Install Vector
  hosts: vector
  become: true

  handlers:
    - name: Restart vector service
      ansible.builtin.systemd:
        name: vector.service
        state: restarted
        daemon_reload: true
        enabled: true

  tasks:
    - name: Install prerequisites
      ansible.builtin.apt:
        name:
          - curl
          - ca-certificates
        state: present
        update_cache: true

    - name: Check if Vector APT repo is already added
      ansible.builtin.stat:
        path: /etc/apt/sources.list.d/vector.list
      register: vector_repo_file

    - name: Add Vector APT repository
      ansible.builtin.shell: |
        bash -c "$(curl -fsSL https://setup.vector.dev)"
      when: not vector_repo_file.stat.exists
      
    - name: Update APT cache
      ansible.builtin.apt:
        update_cache: true

    - name: Install Vector
      ansible.builtin.apt:
        name: vector
        state: present

    - name: Ensure Vector config directory exists
      ansible.builtin.file:
        path: /etc/vector
        state: directory
        owner: root
        group: root
        mode: "0755"

    # ===== СНАЧАЛА ДЕПЛОЙ КОНФИГА =====
    - name: Deploy vector configuration
      ansible.builtin.template:
        src: vector.yml.j2
        dest: "{{ vector_config_path }}"
        owner: root
        group: root
        mode: "0644"
      notify: Restart vector service
      register: config_deploy

    # ===== ВАЛИДАЦИЯ =====
    - name: Validate vector configuration
      ansible.builtin.command: 
        cmd: vector validate --config-yaml /etc/vector/vector.yaml
      register: validate_result
      changed_when: false
      failed_when: false   # <-- ВАЖНО: разрешаем продолжить даже при ошибке
      ignore_errors: yes

    - name: Show validation result
      ansible.builtin.debug:
        msg: "{{ validate_result.stdout_lines }}" # Читаем stdout, а не stderr

    - name: Fail if configuration is invalid
      ansible.builtin.fail:
        msg: "Vector configuration is invalid"
      when: validate_result.rc != 0   
      tags: [validate]

    - name: Show success
      ansible.builtin.debug:
        msg: "Vector configuration is valid"
      when: validate_result is success

    # ===== ПРИНУДИТЕЛЬНЫЙ РЕСТАРТ =====
    - name: Force restart if config changed
      ansible.builtin.meta: flush_handlers
      when: config_deploy is changed
