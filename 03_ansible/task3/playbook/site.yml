---
- name: Install nginx
  hosts: lighthouse
  become: true
  handlers:
    - name: start-nginx
      command: nginx
    - name: reload-nginx
      command: nginx -s reload 
      tags:
        - nginx
        - restartservice

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true

    - name: NGINX | Install NGINX
      ansible.builtin.apt:
        name: nginx
        state: present
      notify: start-nginx
        
      tags:
        - nginx
        - distr

    - name: NGINX | Create nginx configuration
      ansible.builtin.template:
        src: templates/nginx.conf.j2
        dest: /etc/nginx/nginx.conf  #"{{ nginx_config_path }}"
        mode: '0644'
      notify: reload-nginx
      tags:
        - nginx
        - config

- name: Install Lighthouse
  hosts: lighthouse
  become: yes
  handlers:
    - name: reload-nginx
      become: true
      command: nginx -s reload 
  pre_tasks:
    - name: Lighthouse | install dependencies
      become: true
      ansible.builtin.apt:
        name: git
        state: present
  tasks:
    # 1. Явно создаём директорию с правами root
    - name: Ensure Lighthouse directory exists
      ansible.builtin.file:
        path: "{{ lighthouse_location_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      become: yes  
    # 2. Клонируем репозиторий
    - name: Lighthouse | Copy from git
      ansible.builtin.git:
        repo: "{{ lighthouse_vcs }}"
        version: "{{ lighthouse_git_version }}"
        dest: "{{ lighthouse_location_dir }}"
        force: no
        accept_hostkey: yes
        depth: 1
        single_branch: yes
    - name: Lighthouse | Create Lighthouse config
      become: true
      ansible.builtin.template:
        src: templates/lighthouse.conf.j2
        dest: /etc/nginx/conf.d/default.conf
        mode: '0644'
      notify: reload-nginx     

- name: Install Clickhouse
  hosts: clickhouse
  become: true
  handlers:
    - name: Start clickhouse service
      ansible.builtin.service:
        name: clickhouse-server
        state: started
        enabled: yes

  tasks:
    - name: Get clickhouse distrib
      ansible.builtin.get_url:
        url: "https://packages.clickhouse.com/deb/pool/main/c/{{ item }}/{{ item }}_{{ clickhouse_version }}_amd64.deb"
        dest: "/tmp/{{ item }}_{{ clickhouse_version }}_amd64.deb"
        mode: '0644'
      loop: "{{ clickhouse_packages }}"

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install clickhouse packages using dpkg
      ansible.builtin.command:
        cmd: "dpkg -i /tmp/{{ item }}-{{ clickhouse_version }}_amd64.deb"
      with_items: "{{ clickhouse_packages }}"
      notify: Start clickhouse service
      changed_when: false

    # ===== ВАЖНО: ЯВНЫЙ ЗАПУСК СЕРВИСА =====
    - name: Ensure clickhouse-server is started
      ansible.builtin.service:
        name: clickhouse-server
        state: started
        enabled: yes
      register: service_started

    - name: Show service status
      ansible.builtin.debug:
        msg: "Service started: {{ service_started }}"

    # ===== ТЕПЕРЬ ЖДЕМ ПОРТ =====
    - name: Wait for clickhouse-server to be ready (port check)
      ansible.builtin.wait_for:
        port: 9000
        host: "127.0.0.1"  #"{{ ansible_default_ipv4.address | default('localhost') }}"
        timeout: 60
        delay: 5
      register: wait_result
      until: wait_result is success
      retries: 12
      delay: 5

    - name: Check if clickhouse is really ready (query test)
      ansible.builtin.command:
        cmd: clickhouse-client --query "SELECT 1"
      register: query_test
      until: query_test is success
      retries: 30
      delay: 5
      changed_when: false

    - name: Create database logs
      ansible.builtin.command:
        cmd: clickhouse-client --query "CREATE DATABASE IF NOT EXISTS logs"
      register: create_db
      changed_when: "'already exists' not in create_db.stderr"  # Сработает при создании
      failed_when: 
        - create_db.rc != 0
        - "'already exists' not in create_db.stderr"
      tags:
        - clickhouse
        - db

- name: Install Vector
  hosts: vector
  become: true

  handlers:
    - name: Restart vector service
      ansible.builtin.systemd:
        name: vector.service
        state: restarted
        daemon_reload: true
        enabled: true

  tasks:
    - name: Install prerequisites
      ansible.builtin.apt:
        name:
          - curl
          - ca-certificates
        state: present
        update_cache: true

    - name: Check if Vector APT repo is already added
      ansible.builtin.stat:
        path: /etc/apt/sources.list.d/vector.list
      register: vector_repo_file

    - name: Add Vector APT repository
      ansible.builtin.shell: |
        bash -c "$(curl -fsSL https://setup.vector.dev)"
      when: not vector_repo_file.stat.exists
      
    - name: Update APT cache
      ansible.builtin.apt:
        update_cache: true

    - name: Install Vector
      ansible.builtin.apt:
        name: vector
        state: present

    - name: Ensure Vector config directory exists
      ansible.builtin.file:
        path: /etc/vector
        state: directory
        owner: root
        group: root
        mode: "0755"

    # ===== СНАЧАЛА ДЕПЛОЙ КОНФИГА =====
    - name: Deploy vector configuration
      ansible.builtin.template:
        src: vector.yaml.j2
        dest: "{{ vector_config_path }}"
        owner: root
        group: root
        mode: "0644"
      notify: Restart vector service
      register: config_deploy

    # ===== ВАЛИДАЦИЯ =====
    - name: Validate vector configuration
      ansible.builtin.command:
        cmd: vector validate --config-yaml {{ vector_config_path }}
      register: validate_result
      ignore_errors: yes
      changed_when: false

    - name: Show validation result
      ansible.builtin.debug:
        msg: 
          - "Validation output:"
          - "{{ validate_result.stdout_lines }}"
          - "Errors: {{ validate_result.stderr_lines }}"

    - name: Fail if configuration is invalid
      ansible.builtin.fail:
        msg: "Vector configuration is invalid: {{ validate_result.stdout }}"
      when: validate_result is failed
      tags: [validate]

    - name: Show success
      ansible.builtin.debug:
        msg: "✓ Vector configuration is valid"
      when: validate_result is success

    # ===== ПРИНУДИТЕЛЬНЫЙ РЕСТАРТ =====
    - name: Force restart if config changed
      ansible.builtin.meta: flush_handlers
      when: config_deploy is changed
