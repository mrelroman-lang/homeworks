apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app
  labels:
    app: web-app
spec:
  replicas: 5
  selector:
    matchLabels:
      app: web-app
  strategy:
    type: RollingUpdate
    # Настройки для минимального времени обновления 
    # убить все старые поды сразу и создать столько же новых.
    rollingUpdate:
      maxSurge: 5      # Можно создать до 5 новых подов 
      maxUnavailable: 5 # Можно убрать все 5 старых подов сразу.
  template:
    metadata:
      labels:
        app: web-app
    spec:
      containers:
      # Контейнер 1: Nginx
      - name: nginx
        image: nginx:1.19
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 3
      # Контейнер 2: Multitool
      - name: multitool
        image: wbitt/network-multitool
        env:
        - name: HTTP_PORT
          value: "8080"
        - name: HTTPS_PORT
          value: "8443"
        ports:
        - containerPort: 8080
        - containerPort: 8443
