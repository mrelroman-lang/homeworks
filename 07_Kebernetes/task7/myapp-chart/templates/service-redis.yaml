{{- if .Values.redis.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "myapp.fullname" . }}-redis
spec:
  clusterIP: None   # headless — обязателен для StatefulSet
  selector:
    app: {{ include "myapp.fullname" . }}-redis
  ports:
  - port: 6379
    targetPort: 6379
{{- end }}
